<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento</title>
    <link rel="stylesheet" href="../geral.css">
    <link rel="stylesheet" href="pagamento.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="../ENDEREÇO/endereco.html" class="menu"><img src="../assets/images/seta-voltar.png" alt=""></a>
        <a href="../HOME/home.html" class="logo"><img src="../assets/images/logo_azul.png" alt=""></a>
        <a href="" class="user"><img src="../assets/images/usuario.png" alt=""></a>
    </header>
    <main class="corpo_pagamento">
        <div class="tamanhodiv">
            <p class="fonteh">Forma de Entrega</p>
            <p class="fontep">Selecione a opção de entrega que melhor se adequa às suas necessidades.</p>
        </div>
       
        <div class="d_entregas">
            <label for="entrega">Entrega <span class="obrigatorio">*</span></label>
            <select name="" id="seletor">
                <option value="" selected disabled>Selecione a Forma de  Entrega</option>
                <option value="padrao">Padrão - 6 à 9 dias</option>
                <option value="express">Express - 3 à 5 dias</option>
            </select>
            <p id="info-entrega" class="fontep" style="display:none;"></p>
        </div>
        <div class="tamanhodiv">
            <p class="fonteh">Forma de Pagamento</p>
            <p class="fontep">Selecione a opção de pagamento que melhor se adequa às suas necessidades.</p>
        </div>
            <div class="d_pagamentos">
            <label for="entrega">Pagamento <span class="obrigatorio">*</span></label>
            <select name="" id="pagamento">
                <option value="" selected disabled>Selecione a forma de pagamento</option>
                <option value="pix">Pix</option>
                <option value="credito">Cartão - Crédito</option>
             <option value="debito">Cartão - Débito</option>
            </select>
        </div>
        <form class="credito">
            <label for="entrega">Nome no Cartão<span class="obrigatorio">*</span></label>
            <input type="text" name="" class="num_cc" id="nome_cartao" placeholder="Ex.: Gustavo C Doornik">
            <label for="entrega">Número do Cartão<span class="obrigatorio">*</span></label>
            <input type="number" name="" class="num_cc" id="num_cc" placeholder="0000 0000 0000 0000">
            <label for="entrega">Validade<span class="obrigatorio">*</span></label>
            <input type="number" name="" class="num_cc" id="validade" placeholder="MM / YY">
            <label for="entrega">Cód. Segurança<span class="obrigatorio">*</span></label>
            <input type="number" name="" class="num_cc" id="cod_seg" placeholder="000">
        </form>
        <div class="pix">
            <p class="fontep">Escaneie o QR Code abaixo com o app do seu banco ou copie o código Pix.</p>
            <img src="../assets/images/qrcode-pix-exemplo.svg" alt="QR Code para pagamento via Pix" class="qrcode-pix">
            <label for="codigo_pix">Código Pix Copia e Cola</label>
            <div class="copia_pix">
                <input type="text" id="codigo_pix" class="num_cc" readonly value="00020126580014BR.GOV.BCB.PIX0136exemplo-chave-pix-bulbe@energia.com5204000053039865802BR5913Bulbe Energia6009Sao Paulo62070503***6304ABCD">
                <button type="button" id="btn-copiar-pix" class="btn-copiar">Copiar código</button>
            </div>
            <p id="msg-copiado-pix" class="msg-copiado oculto">Código copiado!</p>
        </div>
        <p id="msg-erro" class="msg-erro" style="display:none;"></p>
        <button class="b_confirmar" id="btn-confirmar">Confirmar Pagamento</button>
        <a href="../CARRINHO/carrinho.html" class="voltar">Voltar para o Carrinho</a>
    </main>
    <script src="pagamento.js"></script>
</body>
</html>
